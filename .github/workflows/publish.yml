name: publish

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Verify release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::This workflow must run from a release tag"
              exit 1
            fi
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run pack:check
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured. Add a granular npm token with publish access as a repository secret."
            exit 1
          fi
          npm publish --provenance --access public
      - name: Verify the published version
        env:
          PACKAGE: opencode-nexusnv-github-sidebar
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "$PACKAGE@$VERSION" version; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PACKAGE@$VERSION is not visible on the registry"
          exit 1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
