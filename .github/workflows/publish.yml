name: publish

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Use an npm with trusted publishing support
        run: npm install -g npm@11.19.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Verify release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::This workflow must run from a release tag"
              exit 1
            fi
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run pack:check
      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Once the trusted publisher is configured in the npm web UI, delete the
          # NPM_TOKEN secret. This step then writes nothing and npm exchanges the
          # workflow's GitHub OIDC token for a short-lived publish credential.
          # setup-node only creates NPM_CONFIG_USERCONFIG when registry-url is set;
          # do not depend on that. Fall back to the user's .npmrc and export the
          # path so the publish step sees the same file.
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::Publishing with the NPM_TOKEN secret. Configure the npm trusted publisher and delete the secret to use OIDC."
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$npmrc"
            echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"
          fi
      - name: Publish to npm
        env:
          PACKAGE: opencode-nexusnv-github-sidebar
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # npm can report TLOG_CREATE_ENTRY_ERROR (409) after Rekor already committed
          # the entry, leaving the version unpublished. A fresh npm process signs a new
          # entry, so retry only that error and check the registry between attempts.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            log="$(mktemp)"
            if npm publish --provenance --access public >"$log" 2>&1; then
              cat "$log"
              exit 0
            else
              rc=$?
            fi
            cat "$log"
            if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              echo "The registry already has $PACKAGE@$VERSION; treating the publish as successful."
              exit 0
            fi
            if grep -q "TLOG_CREATE_ENTRY_ERROR" "$log" && [ "$attempt" -lt 3 ]; then
              echo "::warning::npm reported a duplicate Rekor entry (TLOG_CREATE_ENTRY_ERROR); retrying with a fresh signature."
              attempt=$((attempt + 1))
              sleep 15
              continue
            fi
            exit "$rc"
          done
          echo "::error::npm publish failed after 3 attempts."
          exit 1
      - name: Verify the published version
        env:
          PACKAGE: opencode-nexusnv-github-sidebar
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if npm view "$PACKAGE@$VERSION" version; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PACKAGE@$VERSION is not visible on the registry"
          exit 1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
